<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 158" width="600" height="158" shape-rendering="crispEdges" role="img" aria-label="A pixel dinosaur running a timeline: '25 swe intern, '26 fde, '25 swe">
<style>
  svg { --ink: #535353; --soft: #c4c4c4; --label: #6e6e6e; }
  @media (prefers-color-scheme: dark) { svg { --ink: #c9d1d9; --soft: #586069; --label: #8b949e; } }
  .ink { fill: var(--ink); }
  .soft { fill: var(--soft); }
  text { fill: var(--label); font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .dino { animation: jump 7.200s infinite; }
  .run { animation: run 7.200s infinite step-end; }
  .air { animation: air 7.200s infinite step-end; }
  .legs-a { animation: step-a 0.2s infinite step-end; }
  .legs-b { animation: step-b 0.2s infinite step-end; }
  .track { animation: track 7.200s linear infinite; }
  .ground { animation: ground 0.5333s linear infinite; }
  .bumps { animation: bumps 0.8000s linear infinite; }
  .clouds { animation: clouds 14.400s linear infinite; }
  @keyframes jump { 0% { transform: translateY(0); } 25.926% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 30.926% { transform: translateY(-78px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 35.926% { transform: translateY(0); } 53.148% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 58.148% { transform: translateY(-78px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 63.148% { transform: translateY(0); } 81.481% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 86.481% { transform: translateY(-78px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 91.481% { transform: translateY(0); } 100% { transform: translateY(0); } }
  @keyframes run { 0% { opacity: 1; } 25.926% { opacity: 0; } 35.926% { opacity: 1; } 53.148% { opacity: 0; } 63.148% { opacity: 1; } 81.481% { opacity: 0; } 91.481% { opacity: 1; } }
  @keyframes air { 0% { opacity: 0; } 25.926% { opacity: 1; } 35.926% { opacity: 0; } 53.148% { opacity: 1; } 63.148% { opacity: 0; } 81.481% { opacity: 1; } 91.481% { opacity: 0; } }
  @keyframes step-a { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes step-b { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes track { from { transform: translateX(0); } to { transform: translateX(-2160px); } }
  @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-160px); } }
  @keyframes bumps { from { transform: translateX(0); } to { transform: translateX(-240px); } }
  @keyframes clouds { from { transform: translateX(0); } to { transform: translateX(-1500px); } }
  @media (prefers-reduced-motion: reduce) {
    .dino, .run, .air, .legs-a, .legs-b, .track, .ground, .bumps, .clouds { animation: none; }
    .legs-b, .air { opacity: 0; }
  }
</style>
