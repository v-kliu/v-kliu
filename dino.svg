<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 125" width="600" height="125" shape-rendering="crispEdges" role="img" aria-label="A pixel dinosaur running and jumping over slot machines">
<style>
  svg { --ink: #535353; --soft: #c4c4c4; }
  @media (prefers-color-scheme: dark) { svg { --ink: #c9d1d9; --soft: #586069; } }
  .ink { fill: var(--ink); }
  .soft { fill: var(--soft); }
  .dino { animation: jump 8.0s infinite; }
  .run { animation: run 8.0s infinite step-end; }
  .air { animation: air 8.0s infinite step-end; }
  .legs-a { animation: step-a 0.2s infinite step-end; }
  .legs-b { animation: step-b 0.2s infinite step-end; }
  .track { animation: track 8.0s linear infinite; }
  .ground { animation: ground 0.5333s linear infinite; }
  .bumps { animation: bumps 0.8000s linear infinite; }
  .clouds { animation: clouds 16.0s linear infinite; }
  @keyframes jump { 0% { transform: translateY(0); } 23.042% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 26.917% { transform: translateY(-70px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 30.792% { transform: translateY(0); } 50.792% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 54.667% { transform: translateY(-70px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 58.542% { transform: translateY(0); } 78.417% { transform: translateY(0); animation-timing-function: cubic-bezier(.25,.6,.45,1); } 82.292% { transform: translateY(-70px); animation-timing-function: cubic-bezier(.55,0,.75,.4); } 86.167% { transform: translateY(0); } 100% { transform: translateY(0); } }
  @keyframes run { 0% { opacity: 1; } 23.042% { opacity: 0; } 30.792% { opacity: 1; } 50.792% { opacity: 0; } 58.542% { opacity: 1; } 78.417% { opacity: 0; } 86.167% { opacity: 1; } }
  @keyframes air { 0% { opacity: 0; } 23.042% { opacity: 1; } 30.792% { opacity: 0; } 50.792% { opacity: 1; } 58.542% { opacity: 0; } 78.417% { opacity: 1; } 86.167% { opacity: 0; } }
  @keyframes step-a { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes step-b { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes track { from { transform: translateX(0); } to { transform: translateX(-2400.0px); } }
  @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-160px); } }
  @keyframes bumps { from { transform: translateX(0); } to { transform: translateX(-240px); } }
  @keyframes clouds { from { transform: translateX(0); } to { transform: translateX(-1500px); } }
  @media (prefers-reduced-motion: reduce) {
    .dino, .run, .air, .legs-a, .legs-b, .track, .ground, .bumps, .clouds { animation: none; }
    .legs-b, .air { opacity: 0; }
  }
</style>
