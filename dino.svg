<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="800" height="140" role="img" aria-label="A pixel dinosaur running and jumping over cacti">
<style>
  svg { --ink: #535353; --soft: #b5b5b5; }
  @media (prefers-color-scheme: dark) { svg { --ink: #c9d1d9; --soft: #6e7681; } }
  .ink { fill: var(--ink); }
  .soft { fill: var(--soft); }
  .dino { animation: jump 4s infinite; }
  .legs-a { animation: step-a 0.24s steps(1) infinite; }
  .legs-b { animation: step-b 0.24s steps(1) infinite; }
  .cactus { animation: scroll 4s linear infinite; }
  .ground { animation: ground 0.8s linear infinite; }
  .cloud { animation: cloud 16s linear infinite; }
  @keyframes jump {
    0%, 68% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
    78% { transform: translateY(-64px); animation-timing-function: cubic-bezier(.6,0,.8,.3); }
    89%, 100% { transform: translateY(0); }
  }
  @keyframes step-a { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes step-b { 0% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @keyframes ground { from { transform: translateX(0); } to { transform: translateX(-180px); } }
  @keyframes cloud { from { transform: translateX(0); } to { transform: translateX(-1400px); } }
  @media (prefers-reduced-motion: reduce) { .dino, .legs-a, .legs-b, .cactus, .ground, .cloud { animation: none; } .legs-b { opacity: 0; } }
</style>
